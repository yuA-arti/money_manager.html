<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>家計・積立・給与割り振りマネージャー Pro</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-light: #eff6ff;
    --text: #1e293b;
    --border: #e2e8f0;
    --bg: #f8fafc;
    --card: #ffffff;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html, body { width: 100%; max-width: 100%; overflow-x: hidden; background: var(--bg); color: var(--text); }
  body { padding: 8px; padding-bottom: 70px; }

  /* タブ */
  .tabs { display: flex; width: 100%; gap: 4px; margin-bottom: 10px; background: #e2e8f0; padding: 3px; border-radius: 8px; }
  .tab-btn { flex: 1; padding: 8px 2px; text-align: center; font-size: 11.5px; font-weight: bold; border: none; background: transparent; cursor: pointer; border-radius: 6px; color: #64748b; }
  .tab-btn.active { background: #fff; color: var(--primary); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .tab-content { display: none; width: 100%; }
  .tab-content.active { display: block; }

  /* 共通カード */
  .card { background: var(--card); border-radius: 10px; border: 1px solid var(--border); padding: 10px; margin-bottom: 8px; width: 100%; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
  .card-title { font-size: 11px; color: #64748b; margin-bottom: 4px; font-weight: bold; }
  .btn { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 11px; font-weight: 500; white-space: nowrap; }
  .btn-primary { background: var(--primary); color: #fff; border: none; }
  .btn-sm { padding: 2px 6px; font-size: 10px; }
  .btn-edit { background: #f1f5f9; color: #334155; border-color: #cbd5e1; }

  /* タグバッジ */
  .flow-tag { font-size: 9px; padding: 1px 4px; border-radius: 4px; font-weight: bold; white-space: nowrap; }
  .tag-bank { background: #dbeafe; color: #1e40af; }
  .tag-cash { background: #fef3c7; color: #92400e; }
  .tag-save { background: #d1fae5; color: #065f46; }
  .tag-chokin { background: #ede9fe; color: #5b21b6; }

  /* 1. 給与割り振り */
  .income-section { background: #fff; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; width: 100%; overflow: hidden; }
  .income-header { background: #f1f5f9; padding: 8px 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 4px; flex-wrap: wrap; }
  .income-summary-row { padding: 6px 10px; background: #faf5ff; display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; border-top: 1px dashed var(--border); }

  .flow-group-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; margin: 6px; }
  .flow-group-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px; margin-bottom: 4px; }
  .flow-group-header.checked { opacity: 0.5; text-decoration: line-through; }
  .flow-sub-container { transition: max-height 0.2s ease; }
  .flow-sub-item { display: flex; align-items: center; justify-content: space-between; padding: 5px 0 5px 12px; border-bottom: 1px dashed #f8fafc; font-size: 11.5px; gap: 4px; }
  .flow-sub-item.checked { opacity: 0.45; text-decoration: line-through; }
  .amt-meta { font-size: 9px; color: #64748b; display: block; text-align: right; }

  /* 2. 積立カード */
  .saving-card { border-left: 4px solid var(--primary); margin-bottom: 6px; }
  .saving-header { display: flex; justify-content: space-between; align-items: center; }
  .saving-name { font-size: 13px; font-weight: bold; }
  .saving-bal { font-size: 15px; font-weight: bold; color: var(--primary); }
  .saving-history { font-size: 10.5px; background: #f8fafc; border-radius: 6px; padding: 6px 8px; margin-top: 6px; display: none; }
  .history-item { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed #e2e8f0; }

  /* 3. 家計集計 */
  .budget-row { margin-bottom: 10px; }
  .b-label-row { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; margin-bottom: 3px; }
  .b-bar-bg { background: #e2e8f0; height: 10px; border-radius: 5px; overflow: hidden; }
  .b-bar-fill { height: 100%; border-radius: 5px; transition: width 0.3s ease; }
  .b-inputs { display: flex; gap: 6px; align-items: center; margin-top: 3px; }
  .b-input { width: 75px; max-width: 25vw; padding: 3px 4px; font-size: 11px; border: 1px solid var(--border); border-radius: 4px; text-align: right; }

  /* 推移テーブル */
  .history-table { width: 100%; border-collapse: collapse; font-size: 10.5px; }
  .history-table th, .history-table td { border: 1px solid var(--border); padding: 4px 3px; text-align: right; }
  .history-table th:first-child, .history-table td:first-child { text-align: left; }
  .history-table th { background: #f1f5f9; font-weight: 600; }

  /* モーダル */
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 100; padding: 10px; }
  .modal-content { background: #fff; border-radius: 12px; padding: 14px; width: 100%; max-width: 330px; max-height: 90vh; overflow-y: auto; }
  .form-group { margin-bottom: 8px; }
  .form-label { font-size: 10.5px; color: #64748b; margin-bottom: 2px; display: block; }
  .form-input { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; }
</style>
</head>
<body>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('flow')">📋 給与割り振り</button>
  <button class="tab-btn" onclick="switchTab('savings')">🏦 積立通帳</button>
  <button class="tab-btn" onclick="switchTab('budget')">📊 家計集計&推移</button>
</div>

<!-- 1. 給与割り振り -->
<div id="tab-flow" class="tab-content active">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
    <span class="card-title" style="margin:0;">入金ごとの資金移動・袋分け</span>
    <div style="display:flex; gap:4px;">
      <button class="btn btn-sm" onclick="resetAllFlowChecks()">全未済化</button>
      <button class="btn btn-sm btn-primary" onclick="openAddIncomeModal()">＋ 入金枠</button>
    </div>
  </div>
  <div id="incomeSectionsContainer"></div>
</div>

<!-- 2. 積立通帳マネージャー -->
<div id="tab-savings" class="tab-content">
  <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
    <div>
      <div class="card-title">現在の積立実残金 合計</div>
      <div style="font-size:18px; font-weight:bold; color:var(--primary);" id="totalSavingsSum">0 円</div>
    </div>
    <button class="btn btn-sm btn-primary" onclick="openAddSavingModal()">＋ 新規積立枠</button>
  </div>
  <div id="savingContainer"></div>
</div>

<!-- 3. 家計集計 & 予算推移 -->
<div id="tab-budget" class="tab-content">
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div style="display:flex; align-items:center; gap:4px;">
        <span class="card-title" style="margin:0;">月:</span>
        <input type="month" id="budgetMonthPicker" class="b-input" style="width:110px;" onchange="loadSelectedMonthBudget()">
      </div>
      <button class="btn btn-sm btn-primary" onclick="saveCurrentMonthBudget()">💾 今月を保存</button>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-top:6px;">
      <div>
        <div style="font-size:10px; color:#64748b;">支出実績合計 / 予算合計</div>
        <div style="font-size:15px; font-weight:bold;"><span id="totalActualSpend">0</span> 円 / <span id="totalBudgetSum">0</span> 円</div>
      </div>
      <div id="budgetDiffTag" style="font-size:11.5px; font-weight:bold;"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">11費目 予算 vs 実績</div>
    <div id="budgetCategoryList"></div>
  </div>

  <div class="card">
    <div class="card-title">過去月の支出推移比較 (直近3ヶ月)</div>
    <div style="overflow-x:auto;">
      <table class="history-table" id="budgetHistoryTable"></table>
    </div>
  </div>
</div>

<!-- モーダル: 入金枠の追加/編集 -->
<div class="modal" id="incomeModal">
  <div class="modal-content">
    <div style="font-weight:bold; margin-bottom:8px;" id="incModalTitle">入金枠の設定</div>
    <input type="hidden" id="editIncomeId">
    <div class="form-group">
      <label class="form-label">入金名称・日付</label>
      <input type="text" id="newIncTitle" class="form-input" placeholder="例: 9/15 メークス給料">
    </div>
    <div class="form-group">
      <label class="form-label">入金額 (円)</label>
      <input type="number" id="newIncAmount" class="form-input" placeholder="例: 131480">
    </div>
    <div style="display:flex; justify-content:flex-end; gap:6px;">
      <button class="btn" onclick="closeModal('incomeModal')">閉じる</button>
      <button class="btn btn-primary" onclick="saveIncomeSection()">保存</button>
    </div>
  </div>
</div>

<!-- モーダル: 親項目追加/編集 -->
<div class="modal" id="groupModal">
  <div class="modal-content">
    <div style="font-weight:bold; margin-bottom:8px;" id="grpModalTitle">親項目（口座・袋名）の設定</div>
    <input type="hidden" id="editGroupId">
    <div class="form-group">
      <label class="form-label">親項目名（大項目）</label>
      <input type="text" id="groupName" class="form-input" placeholder="例: ドコモ銀行、鹿児島銀行">
    </div>
    <div class="form-group">
      <label class="form-label">種別</label>
      <select id="groupType" class="form-input">
        <option value="bank">口座振込・移動</option>
        <option value="cash">現金・袋分け</option>
        <option value="save">積立入金</option>
        <option value="chokin">貯金</option>
      </select>
    </div>
    <div style="display:flex; justify-content:flex-end; gap:6px;">
      <button class="btn" onclick="closeModal('groupModal')">閉じる</button>
      <button class="btn btn-primary" onclick="saveGroupItem()">保存</button>
    </div>
  </div>
</div>

<!-- モーダル: 小項目追加/編集 -->
<div class="modal" id="subItemModal">
  <div class="modal-content">
    <div style="font-weight:bold; margin-bottom:6px;" id="subModalTitle">小項目の設定</div>
    <input type="hidden" id="editSubId">
    <div class="form-group">
      <label class="form-label">小項目名（目的・内訳）</label>
      <input type="text" id="subName" class="form-input" placeholder="例: 子供貯金、修学旅行積立">
    </div>
    <div class="form-group">
      <label class="form-label">基本の金額 (円)</label>
      <input type="number" id="subBaseAmt" class="form-input" placeholder="例: 3000">
    </div>
    <div class="form-group">
      <label class="form-label">今月の金額 (円)</label>
      <input type="number" id="subCurrAmt" class="form-input" placeholder="例: 1000">
    </div>
    <div style="display:flex; justify-content:flex-end; gap:6px;">
      <button class="btn" onclick="closeModal('subItemModal')">閉じる</button>
      <button class="btn btn-primary" onclick="saveSubItem()">保存</button>
    </div>
  </div>
</div>

<!-- モーダル: 積立入出金 -->
<div class="modal" id="txModal">
  <div class="modal-content">
    <div style="font-weight:bold; margin-bottom:4px;" id="txTitle">入出金記録</div>
    <div style="font-size:10.5px; color:#64748b; margin-bottom:8px;" id="txCurrent"></div>
    <div class="form-group">
      <label class="form-label">処理日</label>
      <input type="date" id="txDate" class="form-input">
    </div>
    <div class="form-group">
      <label class="form-label">種別</label>
      <select id="txType" class="form-input">
        <option value="withdraw">− 出金・取崩し（支払い・補填）</option>
        <option value="deposit">＋ 入金（積立）</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">金額 (円)</label>
      <input type="number" id="txAmount" class="form-input">
    </div>
    <div class="form-group">
      <label class="form-label">目的・用途メモ</label>
      <input type="text" id="txMemo" class="form-input" placeholder="例: 夏ボーナス払い、生活費補填">
    </div>
    <div style="display:flex; justify-content:flex-end; gap:6px;">
      <button class="btn" onclick="closeModal('txModal')">閉じる</button>
      <button class="btn btn-primary" onclick="executeTx()">確定</button>
    </div>
  </div>
</div>

<!-- モーダル: 積立枠追加/編集 -->
<div class="modal" id="savingAddModal">
  <div class="modal-content">
    <div style="font-weight:bold; margin-bottom:8px;" id="savModalTitle">積立枠の設定</div>
    <input type="hidden" id="editSavId">
    <div class="form-group">
      <label class="form-label">積立名</label>
      <input type="text" id="newSavName" class="form-input">
    </div>
    <div class="form-group">
      <label class="form-label">現在残高 (円)</label>
      <input type="number" id="newSavBal" class="form-input">
    </div>
    <div style="display:flex; justify-content:flex-end; gap:6px;">
      <button class="btn" onclick="closeModal('savingAddModal')">閉じる</button>
      <button class="btn btn-primary" onclick="saveSavingAccount()">保存</button>
    </div>
  </div>
</div>

<script>
  const DEFAULT_CATEGORIES = [
    { id: 'c1', name: '固定費', budget: 90000, actual: 0 },
    { id: 'c2', name: '食費・外食費', budget: 35000, actual: 0 },
    { id: 'c3', name: '日用品費', budget: 10000, actual: 0 },
    { id: 'c4', name: '娯楽・趣味', budget: 8000, actual: 0 },
    { id: 'c5', name: '服・美容', budget: 8000, actual: 0 },
    { id: 'c6', name: '子供', budget: 15000, actual: 0 },
    { id: 'c7', name: 'ネコ', budget: 6000, actual: 0 },
    { id: 'c8', name: '車', budget: 12000, actual: 0 },
    { id: 'c9', name: '医療', budget: 5000, actual: 0 },
    { id: 'c10', name: '推活', budget: 10000, actual: 0 },
    { id: 'c11', name: '特別費', budget: 10000, actual: 0 }
  ];

  let currentBudgets = JSON.parse(localStorage.getItem('app_categories_v5') || JSON.stringify(DEFAULT_CATEGORIES));
  let budgetHistory = JSON.parse(localStorage.getItem('app_budget_history_v5') || '{}');

  let incomeSections = JSON.parse(localStorage.getItem('app_income_sections_v5') || JSON.stringify([
    {
      id: 1, title: "9/15 メークス給料", amount: 131480,
      groups: [
        {
          id: 101, name: "ドコモ銀行", type: "bank", checked: false, collapsed: false,
          subItems: [
            { id: 1001, name: "口座へ入金", baseAmt: 30000, currAmt: 30000, checked: false },
            { id: 1002, name: "子供貯金に振替", baseAmt: 5000, currAmt: 5000, checked: false }
          ]
        },
        {
          id: 102, name: "鹿児島銀行", type: "bank", checked: false, collapsed: false,
          subItems: [
            { id: 1003, name: "住宅ローン", baseAmt: 65000, currAmt: 65000, checked: false },
            { id: 1004, name: "修学旅行積立", baseAmt: 3000, currAmt: 1000, checked: false }
          ]
        }
      ]
    },
    {
      id: 2, title: "9/18 はま寿司給料", amount: 52000,
      groups: [
        {
          id: 201, name: "やりくり現金袋", type: "cash", checked: false, collapsed: false,
          subItems: [
            { id: 2001, name: "食費・日用品 現金", baseAmt: 35000, currAmt: 35000, checked: false },
            { id: 2002, name: "予備・ガソリン 現金", baseAmt: 15000, currAmt: 15000, checked: false }
          ]
        }
      ]
    }
  ]));

  let savings = JSON.parse(localStorage.getItem('app_savings_v5') || JSON.stringify([
    { id: 1, name: "住宅ローンボーナス積立", balance: 60000, logs: [] },
    { id: 2, name: "車検・自動車税積立", balance: 30000, logs: [] },
    { id: 3, name: "予備費・生活防衛", balance: 25000, logs: [] }
  ]));

  let targetIncId = null;
  let targetGrpId = null;
  let selectedSavId = null;

  function init() {
    const today = new Date();
    const ym = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
    document.getElementById('budgetMonthPicker').value = ym;
    document.getElementById('txDate').value = today.toISOString().slice(0, 10);

    renderFlowSections();
    renderSavings();
    renderBudgets();
    renderHistoryTable();
  }

  function switchTab(t) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', ['flow','savings','budget'][i] === t);
    });
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(`tab-${t}`).classList.add('active');
  }

  // ---------------- 1. 給与割り振り（開閉アコーディオン対応） ----------------
  function renderFlowSections() {
    const container = document.getElementById('incomeSectionsContainer');
    container.innerHTML = '';

    incomeSections.forEach((sec, sIdx) => {
      let secAlloc = 0;
      sec.groups.forEach(g => g.subItems.forEach(i => secAlloc += i.currAmt));
      const secRem = sec.amount - secAlloc;

      const secEl = document.createElement('div');
      secEl.className = 'income-section';

      let groupsHtml = '';
      sec.groups.forEach((grp, gIdx) => {
        let grpTotal = 0;
        grp.subItems.forEach(s => grpTotal += s.currAmt);

        const tagMap = { bank: ['口座振替','tag-bank'], cash: ['袋分け現金','tag-cash'], save: ['積立入金','tag-save'], chokin: ['貯金','tag-chokin'] };
        const [tagText, tagClass] = tagMap[grp.type] || ['移動', 'tag-bank'];

        let subsHtml = '';
        grp.subItems.forEach((sub, subIdx) => {
          subsHtml += `
            <div class="flow-sub-item ${sub.checked ? 'checked' : ''}">
              <div style="display:flex; align-items:center; gap:6px; min-width:0;">
                <input type="checkbox" ${sub.checked ? 'checked' : ''} onchange="toggleSubCheck(${sIdx}, ${gIdx}, ${subIdx})" style="width:16px;height:16px;flex-shrink:0;">
                <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${sub.name}</span>
              </div>
              <div style="display:flex; align-items:center; gap:4px; flex-shrink:0;">
                <div>
                  <span class="amt-meta">基:${sub.baseAmt.toLocaleString()}</span>
                  <input type="number" class="b-input" style="font-weight:bold;" value="${sub.currAmt}" onchange="updateSubCurrAmt(${sIdx}, ${gIdx}, ${subIdx}, this.value)">
                </div>
                <button class="btn btn-sm btn-edit" onclick="openEditSubModal(${sec.id}, ${grp.id}, ${sub.id})">✏️</button>
                <button class="btn btn-sm" style="border:none; color:#94a3b8;" onclick="deleteSubItem(${sIdx}, ${gIdx}, ${subIdx})">×</button>
              </div>
            </div>
          `;
        });

        // 開閉状態に応じた表示設定
        const isCollapsed = !!grp.collapsed;
        const subListStyle = isCollapsed ? 'display:none;' : 'display:block;';
        const toggleIcon = isCollapsed ? '▼ 開く' : '▲ 隠す';

        groupsHtml += `
          <div class="flow-group-card">
            <div class="flow-group-header ${grp.checked ? 'checked' : ''}">
              <div style="display:flex; align-items:center; gap:4px; min-width:0;">
                <input type="checkbox" ${grp.checked ? 'checked' : ''} onchange="toggleGroupCheck(${sIdx}, ${gIdx})" style="width:16px;height:16px;flex-shrink:0;">
                <button class="btn btn-sm" style="padding:1px 4px; font-size:9.5px; border-color:#cbd5e1;" onclick="toggleGroupCollapse(${sIdx}, ${gIdx})">${toggleIcon}</button>
                <span class="flow-tag ${tagClass}">${tagText}</span>
                <span style="font-size:12px; font-weight:bold; overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${grp.name}</span>
              </div>
              <div style="display:flex; align-items:center; gap:4px; flex-shrink:0;">
                <span style="font-size:11.5px; font-weight:bold; color:var(--primary);">${grpTotal.toLocaleString()}円</span>
                <button class="btn btn-sm btn-edit" onclick="openEditGroupModal(${sec.id}, ${grp.id})">✏️</button>
                <button class="btn btn-sm" style="border:none; color:#94a3b8;" onclick="deleteGroup(${sIdx}, ${gIdx})">×</button>
              </div>
            </div>
            <div id="subContainer-${sec.id}-${grp.id}" style="${subListStyle}">
              ${subsHtml}
              <div style="text-align:right; margin-top:4px;">
                <button class="btn btn-sm" onclick="openAddSubModal(${sec.id}, ${grp.id})">＋ 小項目</button>
              </div>
            </div>
          </div>
        `;
      });

      secEl.innerHTML = `
        <div class="income-header">
          <div style="display:flex; align-items:center; gap:4px; min-width:0; flex-wrap:wrap;">
            <span style="font-size:12px; font-weight:bold;">${sec.title}</span>
            <span style="font-size:12px; font-weight:bold; color:var(--primary);">${sec.amount.toLocaleString()}円</span>
            <button class="btn btn-sm btn-edit" onclick="openEditIncomeModal(${sec.id})">✏️ 編集</button>
          </div>
          <div style="display:flex; gap:4px; flex-shrink:0;">
            <button class="btn btn-sm" onclick="openAddGroupModal(${sec.id})">＋ 親項目</button>
            <button class="btn btn-sm" style="border:none; color:#94a3b8;" onclick="deleteIncomeSection(${sIdx})">×</button>
          </div>
        </div>
        ${groupsHtml}
        <div class="income-summary-row">
          <span>割当計: ${secAlloc.toLocaleString()} 円</span>
          <span style="color:${secRem < 0 ? 'var(--danger)' : 'var(--primary)'};">残余: ${secRem.toLocaleString()} 円</span>
        </div>
      `;
      container.appendChild(secEl);
    });

    localStorage.setItem('app_income_sections_v5', JSON.stringify(incomeSections));
  }

  // 小項目の開閉トグル
  function toggleGroupCollapse(sIdx, gIdx) {
    incomeSections[sIdx].groups[gIdx].collapsed = !incomeSections[sIdx].groups[gIdx].collapsed;
    renderFlowSections();
  }

  function toggleGroupCheck(sIdx, gIdx) {
    incomeSections[sIdx].groups[gIdx].checked = !incomeSections[sIdx].groups[gIdx].checked;
    renderFlowSections();
  }
  function toggleSubCheck(sIdx, gIdx, subIdx) {
    incomeSections[sIdx].groups[gIdx].subItems[subIdx].checked = !incomeSections[sIdx].groups[gIdx].subItems[subIdx].checked;
    renderFlowSections();
  }
  function updateSubCurrAmt(sIdx, gIdx, subIdx, val) {
    incomeSections[sIdx].groups[gIdx].subItems[subIdx].currAmt = parseInt(val, 10) || 0;
    renderFlowSections();
  }
  function deleteSubItem(sIdx, gIdx, subIdx) {
    incomeSections[sIdx].groups[gIdx].subItems.splice(subIdx, 1);
    renderFlowSections();
  }
  function deleteGroup(sIdx, gIdx) {
    if (confirm("親項目と内訳をすべて削除しますか？")) {
      incomeSections[sIdx].groups.splice(gIdx, 1);
      renderFlowSections();
    }
  }
  function deleteIncomeSection(sIdx) {
    if (confirm("この入金枠をすべて削除しますか？")) {
      incomeSections.splice(sIdx, 1);
      renderFlowSections();
    }
  }
  function resetAllFlowChecks() {
    incomeSections.forEach(s => s.groups.forEach(g => {
      g.checked = false;
      g.subItems.forEach(i => i.checked = false);
    }));
    renderFlowSections();
  }

  // 入金枠 追加/編集
  function openAddIncomeModal() {
    document.getElementById('incModalTitle').innerText = '入金枠の追加';
    document.getElementById('editIncomeId').value = '';
    document.getElementById('newIncTitle').value = '';
    document.getElementById('newIncAmount').value = '';
    document.getElementById('incomeModal').style.display = 'flex';
  }
  function openEditIncomeModal(secId) {
    const sec = incomeSections.find(s => s.id === secId);
    document.getElementById('incModalTitle').innerText = '入金枠の修正';
    document.getElementById('editIncomeId').value = sec.id;
    document.getElementById('newIncTitle').value = sec.title;
    document.getElementById('newIncAmount').value = sec.amount;
    document.getElementById('incomeModal').style.display = 'flex';
  }
  function saveIncomeSection() {
    const editId = document.getElementById('editIncomeId').value;
    const title = document.getElementById('newIncTitle').value.trim();
    const amount = parseInt(document.getElementById('newIncAmount').value, 10) || 0;
    if (!title) return;

    if (editId) {
      const sec = incomeSections.find(s => s.id === parseInt(editId, 10));
      sec.title = title;
      sec.amount = amount;
    } else {
      incomeSections.push({ id: Date.now(), title, amount, groups: [] });
    }
    closeModal('incomeModal');
    renderFlowSections();
  }

  // 親項目 追加/編集
  function openAddGroupModal(secId) {
    targetIncId = secId;
    document.getElementById('grpModalTitle').innerText = '親項目（大項目）の追加';
    document.getElementById('editGroupId').value = '';
    document.getElementById('groupName').value = '';
    document.getElementById('groupType').value = 'bank';
    document.getElementById('groupModal').style.display = 'flex';
  }
  function openEditGroupModal(secId, grpId) {
    targetIncId = secId;
    const sec = incomeSections.find(s => s.id === secId);
    const grp = sec.groups.find(g => g.id === grpId);
    document.getElementById('grpModalTitle').innerText = '親項目の修正';
    document.getElementById('editGroupId').value = grp.id;
    document.getElementById('groupName').value = grp.name;
    document.getElementById('groupType').value = grp.type;
    document.getElementById('groupModal').style.display = 'flex';
  }
  function saveGroupItem() {
    const editId = document.getElementById('editGroupId').value;
    const name = document.getElementById('groupName').value.trim();
    const type = document.getElementById('groupType').value;
    if (!name) return;

    const sec = incomeSections.find(s => s.id === targetIncId);
    if (editId) {
      const grp = sec.groups.find(g => g.id === parseInt(editId, 10));
      grp.name = name;
      grp.type = type;
    } else {
      sec.groups.push({ id: Date.now(), name, type, checked: false, collapsed: false, subItems: [] });
    }
    closeModal('groupModal');
    renderFlowSections();
  }

  // 小項目 追加/編集
  function openAddSubModal(secId, grpId) {
    targetIncId = secId;
    targetGrpId = grpId;
    document.getElementById('subModalTitle').innerText = '小項目の追加';
    document.getElementById('editSubId').value = '';
    document.getElementById('subName').value = '';
    document.getElementById('subBaseAmt').value = '';
    document.getElementById('subCurrAmt').value = '';
    document.getElementById('subItemModal').style.display = 'flex';
  }
  function openEditSubModal(secId, grpId, subId) {
    targetIncId = secId;
    targetGrpId = grpId;
    const sec = incomeSections.find(s => s.id === secId);
    const grp = sec.groups.find(g => g.id === grpId);
    const sub = grp.subItems.find(i => i.id === subId);

    document.getElementById('subModalTitle').innerText = '小項目の修正';
    document.getElementById('editSubId').value = sub.id;
    document.getElementById('subName').value = sub.name;
    document.getElementById('subBaseAmt').value = sub.baseAmt;
    document.getElementById('subCurrAmt').value = sub.currAmt;
    document.getElementById('subItemModal').style.display = 'flex';
  }
  function saveSubItem() {
    const editId = document.getElementById('editSubId').value;
    const name = document.getElementById('subName').value.trim();
    const baseAmt = parseInt(document.getElementById('subBaseAmt').value, 10) || 0;
    const currAmt = parseInt(document.getElementById('subCurrAmt').value, 10) || baseAmt;
    if (!name) return;

    const sec = incomeSections.find(s => s.id === targetIncId);
    const grp = sec.groups.find(g => g.id === targetGrpId);

    if (editId) {
      const sub = grp.subItems.find(i => i.id === parseInt(editId, 10));
      sub.name = name;
      sub.baseAmt = baseAmt;
      sub.currAmt = currAmt;
    } else {
      grp.subItems.push({ id: Date.now(), name, baseAmt, currAmt, checked: false });
    }
    closeModal('subItemModal');
    renderFlowSections();
  }

  // ---------------- 2. 積立通帳マネージャー ----------------
  function renderSavings() {
    const box = document.getElementById('savingContainer');
    box.innerHTML = '';
    let totalSum = 0;

    savings.forEach(s => {
      totalSum += s.balance;
      const card = document.createElement('div');
      card.className = 'card saving-card';
      
      let logsHtml = '';
      if (s.logs && s.logs.length > 0) {
        logsHtml = s.logs.slice().sort((a,b) => b.date.localeCompare(a.date)).map(l => `
          <div class="history-item">
            <span>${l.date} <b>${l.memo}</b></span>
            <span style="color:${l.type === 'deposit' ? 'var(--success)' : 'var(--danger)'}; font-weight:bold;">
              ${l.type === 'deposit' ? '+' : '-'}${l.amt.toLocaleString()}円
            </span>
          </div>
        `).join('');
      } else {
        logsHtml = '<div style="color:#94a3b8; text-align:center;">履歴はありません</div>';
      }

      card.innerHTML = `
        <div class="saving-header">
          <span class="saving-name">${s.name}</span>
          <span class="saving-bal">${s.balance.toLocaleString()} 円</span>
        </div>
        <div style="display:flex; gap:4px; margin-top:6px; flex-wrap:wrap;">
          <button class="btn btn-sm btn-primary" onclick="openTxModal(${s.id}, 'withdraw')">− 引出</button>
          <button class="btn btn-sm" onclick="openTxModal(${s.id}, 'deposit')">＋ 積立</button>
          <button class="btn btn-sm" onclick="toggleLog(${s.id})">📜 履歴 (${s.logs ? s.logs.length : 0})</button>
          <button class="btn btn-sm btn-edit" onclick="openEditSavingModal(${s.id})">✏️ 修正</button>
          <button class="btn btn-sm" style="margin-left:auto; border:none; color:#94a3b8;" onclick="delSaving(${s.id})">×</button>
        </div>
        <div class="saving-history" id="log-${s.id}">
          ${logsHtml}
        </div>
      `;
      box.appendChild(card);
    });

    document.getElementById('totalSavingsSum').innerText = `${totalSum.toLocaleString()} 円`;
    localStorage.setItem('app_savings_v5', JSON.stringify(savings));
  }

  function toggleLog(id) {
    const el = document.getElementById(`log-${id}`);
    el.style.display = el.style.display === 'block' ? 'none' : 'block';
  }

  function openTxModal(id, defaultType) {
    selectedSavId = id;
    const s = savings.find(x => x.id === id);
    document.getElementById('txTitle').innerText = `${s.name} の入出金`;
    document.getElementById('txCurrent').innerText = `実残金: ${s.balance.toLocaleString()} 円`;
    document.getElementById('txType').value = defaultType;
    document.getElementById('txAmount').value = '';
    document.getElementById('txMemo').value = '';
    document.getElementById('txModal').style.display = 'flex';
  }

  function executeTx() {
    const s = savings.find(x => x.id === selectedSavId);
    const date = document.getElementById('txDate').value || new Date().toISOString().slice(0,10);
    const type = document.getElementById('txType').value;
    const amt = parseInt(document.getElementById('txAmount').value, 10) || 0;
    const memo = document.getElementById('txMemo').value.trim();

    if (amt <= 0) return alert('金額を正しく入力してください');

    if (type === 'withdraw') {
      if (amt > s.balance && !confirm("残金を超えています。記録しますか？")) return;
      s.balance -= amt;
    } else {
      s.balance += amt;
    }

    if (!s.logs) s.logs = [];
    s.logs.push({ date, type, amt, memo: memo || (type === 'deposit' ? '積立入金' : '引き出し') });

    closeModal('txModal');
    renderSavings();
  }

  function openAddSavingModal() {
    document.getElementById('savModalTitle').innerText = '新規積立枠の追加';
    document.getElementById('editSavId').value = '';
    document.getElementById('newSavName').value = '';
    document.getElementById('newSavBal').value = '0';
    document.getElementById('savingAddModal').style.display = 'flex';
  }
  function openEditSavingModal(id) {
    const s = savings.find(x => x.id === id);
    document.getElementById('savModalTitle').innerText = '積立枠の修正';
    document.getElementById('editSavId').value = s.id;
    document.getElementById('newSavName').value = s.name;
    document.getElementById('newSavBal').value = s.balance;
    document.getElementById('savingAddModal').style.display = 'flex';
  }
  function saveSavingAccount() {
    const editId = document.getElementById('editSavId').value;
    const name = document.getElementById('newSavName').value.trim();
    const balance = parseInt(document.getElementById('newSavBal').value, 10) || 0;
    if (!name) return;

    if (editId) {
      const s = savings.find(x => x.id === parseInt(editId, 10));
      s.name = name;
      s.balance = balance;
    } else {
      savings.push({ id: Date.now(), name, balance, logs: [] });
    }
    closeModal('savingAddModal');
    renderSavings();
  }
  function delSaving(id) {
    if (confirm("この積立枠を削除しますか？")) {
      savings = savings.filter(s => s.id !== id);
      renderSavings();
    }
  }

  // ---------------- 3. 家計集計 & 予算推移 ----------------
  function renderBudgets() {
    const box = document.getElementById('budgetCategoryList');
    box.innerHTML = '';
    let totalBud = 0, totalAct = 0;

    currentBudgets.forEach((cat, idx) => {
      totalBud += cat.budget;
      totalAct += cat.actual;

      const rate = cat.budget > 0 ? Math.round((cat.actual / cat.budget) * 100) : 0;
      const diff = cat.budget - cat.actual;
      const isOver = diff < 0;

      const barColor = isOver ? 'var(--danger)' : (rate > 85 ? 'var(--warning)' : 'var(--primary)');
      const statusTag = isOver
        ? `<span style="color:var(--danger);">(${Math.abs(diff).toLocaleString()}円 超 / ${rate}%)</span>`
        : `<span style="color:var(--success);">(残 ${diff.toLocaleString()}円 / ${rate}%)</span>`;

      const div = document.createElement('div');
      div.className = 'budget-row';
      div.innerHTML = `
        <div class="b-label-row">
          <span>${cat.name}</span>
          <span>${cat.actual.toLocaleString()} / ${cat.budget.toLocaleString()} 円 ${statusTag}</span>
        </div>
        <div class="b-bar-bg">
          <div class="b-bar-fill" style="width: ${rate > 100 ? 100 : rate}%; background: ${barColor};"></div>
        </div>
        <div class="b-inputs">
          <span style="font-size:10px; color:#64748b;">実績:</span>
          <input type="number" class="b-input" value="${cat.actual}" onchange="updateCatActual(${idx}, this.value)">
          <span style="font-size:10px; color:#64748b; margin-left:4px;">基準:</span>
          <input type="number" class="b-input" value="${cat.budget}" onchange="updateCatBudget(${idx}, this.value)">
        </div>
      `;
      box.appendChild(div);
    });

    document.getElementById('totalActualSpend').innerText = totalAct.toLocaleString();
    document.getElementById('totalBudgetSum').innerText = totalBud.toLocaleString();

    const diffEl = document.getElementById('budgetDiffTag');
    const totalDiff = totalBud - totalAct;
    if (totalDiff >= 0) {
      diffEl.innerText = `残 ${totalDiff.toLocaleString()} 円`;
      diffEl.style.color = 'var(--success)';
    } else {
      diffEl.innerText = `${Math.abs(totalDiff).toLocaleString()} 円 超過`;
      diffEl.style.color = 'var(--danger)';
    }

    localStorage.setItem('app_categories_v5', JSON.stringify(currentBudgets));
  }

  function updateCatActual(idx, val) {
    currentBudgets[idx].actual = parseInt(val, 10) || 0;
    renderBudgets();
  }
  function updateCatBudget(idx, val) {
    currentBudgets[idx].budget = parseInt(val, 10) || 0;
    renderBudgets();
  }

  function saveCurrentMonthBudget() {
    const ym = document.getElementById('budgetMonthPicker').value;
    if (!ym) return alert('年月を選択してください');
    budgetHistory[ym] = JSON.parse(JSON.stringify(currentBudgets));
    localStorage.setItem('app_budget_history_v5', JSON.stringify(budgetHistory));
    renderHistoryTable();
    alert(`${ym} の集計を保存しました`);
  }

  function loadSelectedMonthBudget() {
    const ym = document.getElementById('budgetMonthPicker').value;
    if (budgetHistory[ym]) {
      currentBudgets = JSON.parse(JSON.stringify(budgetHistory[ym]));
      renderBudgets();
    }
  }

  function renderHistoryTable() {
    const table = document.getElementById('budgetHistoryTable');
    const months = Object.keys(budgetHistory).sort().slice(-3);
    if (months.length === 0) {
      table.innerHTML = '<tr><td style="text-align:center; color:#94a3b8;">保存された過去データがありません</td></tr>';
      return;
    }

    let headerHtml = '<tr><th>費目</th>';
    months.forEach(m => headerHtml += `<th>${m.slice(5)}月</th>`);
    headerHtml += '</tr>';

    let rowsHtml = '';
    DEFAULT_CATEGORIES.forEach(cat => {
      rowsHtml += `<tr><td>${cat.name}</td>`;
      months.forEach(m => {
        const histCat = budgetHistory[m].find(c => c.name === cat.name);
        const act = histCat ? histCat.actual : 0;
        rowsHtml += `<td>${act.toLocaleString()}</td>`;
      });
      rowsHtml += `</tr>`;
    });

    rowsHtml += '<tr style="font-weight:bold; background:#f8fafc;"><td>総計</td>';
    months.forEach(m => {
      const sum = budgetHistory[m].reduce((acc, c) => acc + c.actual, 0);
      rowsHtml += `<td>${sum.toLocaleString()}</td>`;
    });
    rowsHtml += '</tr>';

    table.innerHTML = headerHtml + rowsHtml;
  }

  function closeModal(id) { document.getElementById(id).style.display = 'none'; }

  init();
</script>
</body>
</html>
